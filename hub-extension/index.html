<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Release Notes Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Smart Release Notes Generator</h1>
            <p>Release Notes générées automatiquement via OpenAI GPT-4o-mini</p>
        </div>

        <div class="card" id="listCard">
            <h2>📋 Release Notes</h2>
            <div id="notesList">
                <p style="color:#888;">Chargement...</p>
            </div>
        </div>

        <div class="card" id="releaseNotesCard" style="display:none">
            <div style="margin-bottom:16px;">
                <button onclick="backToList()" class="btn-secondary">← Retour</button>
            </div>
            <h2>Release Note</h2>
            <div class="status-bar">
                <span id="statusBadge" class="badge badge-active">🟡 Active</span>
                <span id="releaseName"></span>
            </div>
            <div id="releaseNotesContent" class="release-notes-preview"></div>
            <div class="actions">
                <button id="markDoneBtn" class="btn-success" disabled>✅ Marquer comme Done</button>
                <button id="exportBtn" class="btn-secondary" disabled>📄 Envoyer au client</button>
            </div>
        </div>

        <div id="loadingOverlay" class="loading-overlay" style="display:none">
            <div class="spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="dist/bundle.js"></script>
</body>
</html>
